<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>{{heading}}</h1>
        <ul class="item-list">
            {{#each items}}
            <li class="item">
                <span class="name">{{name}}</span>
                <span class="price">${{price}}</span>
            </li>
            {{/each}}
        </ul>
        <nav>
            <a href="/">Home</a> |
            <a href="/items">Items</a>
        </nav>
        {{#if show_footer}}
        <footer>
            <p>Powered by AID Language &mdash; std.html module</p>
        </footer>
        {{/if}}
    </div>
</body>
</html>
